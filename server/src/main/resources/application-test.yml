spring:
  datasource:
    url: jdbc:h2:mem:projectflow;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  autoconfigure:
    exclude: []

app:
  jwt:
    secret: test-only-secret-key-must-be-at-least-32-chars
    expiration-ms: 3600000
    cookie-name: pf_access_token
  frontend-url: http://localhost:5173
  cookie-secure: false
