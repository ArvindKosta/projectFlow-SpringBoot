server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: projectflow
  profiles:
    default: dev
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:projectFlow_springBoot}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
    username: ${DB_USERNAME:projectflow_user}
    password: ${DB_PASSWORD:replace_me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  cookie-secure: ${COOKIE_SECURE:false}
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-use-a-long-random-secret-key}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    cookie-name: pf_access_token

