services:
  mysql:
    image: mysql:8.4
    container_name: projectFlow-springBoot-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: projectFlow_springBoot
      MYSQL_USER: projectflow_user
      MYSQL_PASSWORD: replace_me
      MYSQL_ROOT_PASSWORD: replace_root_password
    volumes:
      - projectFlow_springBoot_mysql_data:/var/lib/mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 8

volumes:
  projectFlow_springBoot_mysql_data:

